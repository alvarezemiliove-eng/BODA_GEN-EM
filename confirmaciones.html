<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmaciones · Emilio &amp; Génesis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1f3a5f; --granate:#6d1a36; --crema:#faf6ef; --tinta:#2e2a26; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Inter", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background:var(--crema); color:var(--tinta); }
  header { background:var(--navy); color:#fff; padding:1.4rem 1.5rem; }
  header h1 { margin:0; font-weight:normal; letter-spacing:.08em; font-size:1.25rem; }
  header p { margin:.3rem 0 0; opacity:.85; font-size:.85rem; letter-spacing:.05em; }
  main { max-width:1000px; margin:0 auto; padding:1.5rem; }
  .panel { display:grid; grid-template-columns: 230px 1fr; gap:1.2rem; margin-bottom:1.2rem; align-items:start; }
  .lateral { display:flex; flex-direction:column; gap:.8rem; }
  .lateral-kpi { background:var(--navy); color:#fff; border-radius:12px; padding:1rem 1.2rem; }
  .lateral-kpi .num { font-size:1.9rem; font-weight:700; line-height:1.1; }
  .lateral-kpi .eti { font-size:.68rem; letter-spacing:.1em; text-transform:uppercase; opacity:.85; margin-top:.2rem; }
  .lateral-kpi.verde { background:#2e7d32; }
  .tarjetas { display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1.2rem; }
  .tarjeta { flex:1; min-width:150px; background:#fff; border:1px solid rgba(31,58,95,.15); border-radius:12px; padding:1rem 1.2rem; }
  .tarjeta .num { font-size:1.9rem; }
  .tarjeta .eti { font-size:.75rem; letter-spacing:.1em; color:#8a8377; text-transform:uppercase; }
  .ok { color:#2e7d32; } .pen { color:#c62828; } .tot { color:var(--navy); }
  .barra { height:8px; border-radius:6px; background:#e6e0d3; overflow:hidden; margin-bottom:1.4rem; }
  .barra div { height:100%; background:#2e7d32; width:0; transition:width .3s; }
  .fila { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; margin-bottom:1.2rem; }
  input[type=text] { flex:1; min-width:200px; padding:.6rem .8rem; border:1px solid #d8d0bf; border-radius:8px; font-family:inherit; }
  button { background:var(--navy); color:#fff; border:0; border-radius:8px; padding:.6rem 1.1rem; cursor:pointer; font-family:inherit; letter-spacing:.05em; }
  button:hover { background:var(--granate); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .tabla { overflow:auto; background:#fff; border:1px solid rgba(31,58,95,.15); border-radius:12px; }
  table { border-collapse:collapse; width:100%; font-size:.9rem; }
  th { background:var(--navy); color:#fff; text-align:left; padding:.6rem .7rem; font-weight:normal; letter-spacing:.05em; white-space:nowrap; }
  td { padding:.55rem .7rem; border-top:1px solid #efe9db; vertical-align:top; }
  tr:nth-child(even) td { background:#fbf8f0; }
  .chip { display:inline-block; padding:.18rem .6rem; border-radius:50px; font-size:.75rem; letter-spacing:.03em; }
  .chip-conf { background:#e8f5e9; color:#2e7d32; border:1px solid #a5d6a7; }
  .chip-pend { background:#fdecea; color:#c62828; border:1px solid #ef9a9a; }
  .fecha { white-space:nowrap; font-size:.8rem; color:#8a8377; }
  .sel-estado { font-family:inherit; font-size:.82rem; padding:.28rem .45rem; border:1px solid #d8d0bf; border-radius:8px; background:#fff; color:var(--tinta); cursor:pointer; white-space:nowrap; }
  .sel-estado:focus { outline:2px solid var(--granate); }
  #estado { color:#8a8377; font-size:.8rem; margin-top:.8rem; }
  footer { text-align:center; color:#b0a892; font-size:.75rem; padding:1.5rem; letter-spacing:.05em; }
  @media (max-width: 720px) { .panel { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>CONFIRMACIONES · EMILIO &amp; GÉNESIS</h1>
  <p id="fuente">Cargando confirmaciones…</p>
</header>
<main>
  <div class="panel">
    <aside class="lateral">
      <div class="lateral-kpi verde"><div class="num" id="t-mesas">–</div><div class="eti">Mesas necesarias</div></div>
      <div class="lateral-kpi verde"><div class="num" id="t-pasapalos">–</div><div class="eti">Pasapalos</div></div>
      <div class="lateral-kpi"><div class="num" id="t-pct-conf">–</div><div class="eti">% invitados confirmados</div></div>
      <div class="lateral-kpi"><div class="num" id="t-pct-asis">–</div><div class="eti">% asistentes</div></div>
    </aside>
    <div class="principal">
      <div class="tarjetas">
        <div class="tarjeta"><div class="num tot" id="t-total">–</div><div class="eti">Invitados</div></div>
        <div class="tarjeta"><div class="num ok" id="t-conf">–</div><div class="eti">Confirmados</div></div>
        <div class="tarjeta"><div class="num pen" id="t-pend">–</div><div class="eti">Pendientes</div></div>
      </div>
      <div class="barra"><div id="barra-prog"></div></div>
    </div>
  </div>
  <div class="fila">
    <input type="text" id="buscar" placeholder="Buscar por nombre o familia…">
    <button id="btn-refrescar">Actualizar</button>
    <button id="btn-excel">Descargar Excel (.xlsx)</button>
    <button id="btn-csv">Descargar CSV</button>
  </div>
  <div class="tabla">
    <table id="tabla">
      <thead>
        <tr><th>N° Inv</th><th>Nombre</th><th>Familia</th><th>Teléfono</th><th>Válido</th><th>Confirmación</th><th>Asistirá</th><th>Fecha y Hora</th></tr>
      </thead>
      <tbody id="cuerpo"></tbody>
    </table>
  </div>
  <p id="estado"></p>
</main>
<footer>Confirmaciones guardadas en GitHub</footer>

<script>
(function () {
  var filas = [];          // todas las filas de confirmaciones
  var visibles = [];       // filas filtradas por el buscador
  var cabecera = ["N° Inv", "Nombre", "Familia", "Teléfono", "Válido", "Confirmación", "Asistirá", "Fecha y Hora"];
  var fuente = document.getElementById("fuente");
  var cuerpo = document.getElementById("cuerpo");
  var buscar = document.getElementById("buscar");
  var estado = document.getElementById("estado");

  var url = "https://boda-invitaciones.onrender.com/api/confirmaciones";
  var urlEstado = "https://boda-invitaciones.onrender.com/api/estado";

  function cargar() {
    estado.textContent = "Cargando…";
    cuerpo.innerHTML = '<tr><td colspan="8" style="color:#8a8377">Cargando datos…</td></tr>';
    fetch(url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (datos) {
      filas = [];
      for (var i = 0; i < datos.length; i++) {
        var f = datos[i] || {};
        if (!(f.nombre || "").trim()) continue;
        filas.push({
          n_inv: (f.n_inv || "").trim(),
          nombre: (f.nombre || "").trim(),
          familia: (f.familia || "").trim() || "-",
          telefono: (f.telefono || "").trim(),
          valido: (f.valido || "").trim(),
          confirmacion: (f.confirmacion || "").trim(),
          asistira: (f.asistira || "No").trim(),
          fecha: (f.fecha || "").trim()
        });
      }
      fuente.textContent = "Datos actualizados: " + (new Date()).toLocaleString();
      aplicarFiltro();
      estado.textContent = filas.length + " invitados cargados.";
    }).catch(function (e) {
      fuente.textContent = "Error al cargar los datos";
      cuerpo.innerHTML = '<tr><td colspan="8" style="color:#c62828">No se pudieron leer las confirmaciones: ' +
        (e && e.message ? e.message : e) + "</td></tr>";
      estado.textContent = "Verifica que la app esté corriendo.";
    });
  }

  function esConfirmado(f) { return f.confirmacion === "Confirmado"; }
  function esAsistente(f) { return f.asistira === "Sí"; }

  function aplicarFiltro() {
    var q = buscar.value.trim().toLowerCase();
    visibles = filas.filter(function (f) {
      if (!q) return true;
      return f.nombre.toLowerCase().indexOf(q) !== -1 ||
             f.familia.toLowerCase().indexOf(q) !== -1 ||
             (f.n_inv || "").indexOf(q) !== -1;
    });
    pintar();
  }

  function pintar() {
    var conf = 0, asis = 0;
    filas.forEach(function (f) {
      if (esConfirmado(f)) conf++;
      if (esAsistente(f)) asis++;
    });
    var total = filas.length;
    document.getElementById("t-total").textContent = total;
    document.getElementById("t-conf").textContent = conf;
    document.getElementById("t-pend").textContent = total - conf;
    document.getElementById("t-mesas").textContent = Math.ceil(asis / 8) || 0;
    document.getElementById("t-pasapalos").textContent = (asis * 25).toLocaleString("es-VE");
    document.getElementById("t-pct-conf").textContent =
      (total ? Math.round((conf / total) * 100) : 0) + "%";
    document.getElementById("t-pct-asis").textContent =
      (total ? Math.round((asis / total) * 100) : 0) + "%";
    document.getElementById("barra-prog").style.width =
      (total ? Math.round((asis / total) * 100) : 0) + "%";

    cuerpo.innerHTML = "";
    if (!visibles.length) {
      cuerpo.innerHTML = '<tr><td colspan="8" style="color:#8a8377">Sin resultados.</td></tr>';
      return;
    }
    visibles.forEach(function (f) {
      var tr = document.createElement("tr");
      var ok = esConfirmado(f);
      var va = esAsistente(f);
      var i = filas.indexOf(f);
      var selConf =
        '<select class="sel-estado" data-idx="' + i + '" data-campo="confirmacion">' +
        '<option value="No confirmado"' + (ok ? "" : " selected") + ">No confirmado</option>" +
        '<option value="Confirmado"' + (ok ? " selected" : "") + ">Confirmado</option>" +
        "</select>";
      var selAsis =
        '<select class="sel-estado" data-idx="' + i + '" data-campo="asistira">' +
        '<option value="No"' + (va ? "" : " selected") + ">No</option>" +
        '<option value="Sí"' + (va ? " selected" : "") + ">Sí</option>" +
        "</select>";
      tr.innerHTML =
        "<td>" + esc(f.n_inv) + "</td>" +
        "<td>" + esc(f.nombre) + "</td>" +
        "<td>" + esc(f.familia) + "</td>" +
        "<td>" + esc(f.telefono) + "</td>" +
        "<td>" + esc(f.valido) + "</td>" +
        "<td>" + selConf + "</td>" +
        "<td>" + selAsis + "</td>" +
        '<td class="fecha">' + esc(f.fecha) + "</td>";
      cuerpo.appendChild(tr);
    });
  }

  cuerpo.addEventListener("change", function (e) {
    var sel = e.target;
    if (!sel.classList || !sel.classList.contains("sel-estado")) return;
    var f = filas[parseInt(sel.getAttribute("data-idx"), 10)];
    if (!f) return;
    f[sel.getAttribute("data-campo")] = sel.value;
    pintar();
    estado.textContent = "Guardando: " + f.nombre + " …";
    fetch(urlEstado, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nombre: f.nombre,
        familia: f.familia,
        confirmacion: f.confirmacion,
        asistira: f.asistira
      })
    }).then(function (r) { return r.json(); }).then(function (j) {
      estado.textContent = (j && j.ok && j.encontrados)
        ? "Guardado: " + f.nombre + " → " + f.confirmacion
        : "No se encontró el invitado: " + f.nombre;
    }).catch(function () {
      estado.textContent = "Error al guardar en el servidor.";
    });
  });

  function esc(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function aoaActual() {
    var aoa = [cabecera];
    filas.forEach(function (f) {
      aoa.push([f.n_inv, f.nombre, f.familia, f.telefono, f.valido,
        esConfirmado(f) ? "Confirmado" : "No confirmado",
        esAsistente(f) ? "Sí" : "No", f.fecha]);
    });
    return aoa;
  }

  document.getElementById("btn-excel").addEventListener("click", function () {
    if (typeof XLSX === "undefined") {
      estado.textContent = "Cargando la libreria de Excel…";
      var s = document.createElement("script");
      s.src = "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js";
      s.onload = function () { descargarExcel(); };
      s.onerror = function () { estado.textContent = "No se pudo cargar la libreria; usa Descargar CSV."; };
      document.head.appendChild(s);
      return;
    }
    descargarExcel();
  });

  function descargarExcel() {
    var aoa = aoaActual();
    var hoja = XLSX.utils.aoa_to_sheet(aoa);
    hoja["!cols"] = [{ wch: 8 }, { wch: 24 }, { wch: 30 }, { wch: 16 }, { wch: 8 }, { wch: 14 }, { wch: 10 }, { wch: 22 }];
    var libro = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(libro, hoja, "Confirmaciones");
    XLSX.writeFile(libro, "confirmaciones.xlsx");
    estado.textContent = "Excel descargado (" + filas.length + " invitados).";
  }

  document.getElementById("btn-csv").addEventListener("click", function () {
    var lineas = [cabecera.join(",")];
    filas.forEach(function (f) {
      var v = [f.n_inv, f.nombre, f.familia, f.telefono, f.valido,
        esConfirmado(f) ? "Confirmado" : "No confirmado",
        esAsistente(f) ? "Sí" : "No", f.fecha];
      lineas.push(v.map(function (x) { return '"' + String(x || "").replace(/"/g, '""') + '"'; }).join(","));
    });
    var blob = new Blob(["\uFEFF" + lineas.join("\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "confirmaciones.csv";
    a.click();
    URL.revokeObjectURL(a.href);
    estado.textContent = "CSV descargado (" + filas.length + " invitados).";
  });

  buscar.addEventListener("input", aplicarFiltro);
  document.getElementById("btn-refrescar").addEventListener("click", cargar);

  cargar();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospedaje recomendado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --blanco: #ffffff;
    --tinta: #1f1f1f;
    --navy: #323c61;
    --maroon: #602229;
    --gris: #6b6b6b;
    --linea: #d8d3c8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Myriad Pro", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--blanco);
    color: var(--tinta);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .contenido {
    max-width: 560px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
    text-align: center;
  }
  .volver {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    margin-top: 2.6rem;
    font-size: .78rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--navy);
    text-decoration: none;
    border-bottom: 1px solid var(--navy);
    padding-bottom: .1rem;
  }
  .volver svg { width: 1em; height: 1em; }
  .pareja {
    margin-top: 2.6rem;
    margin-bottom: 2.4rem;
    font-family: "Playfair Display SC", Georgia, serif;
    font-variant: small-caps;
    font-size: 1.15rem;
    letter-spacing: .14em;
    color: var(--tinta);
  }
  .titulo-seccion {
    margin-top: 3rem;
    font-family: "Playfair Display SC", Georgia, serif;
    font-variant: small-caps;
    font-size: 1.5rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--navy);
    margin-bottom: 2.4rem;
  }
  .hoteles { max-width: 400px; margin: 0 auto; }
  .intro-opciones {
    max-width: 420px;
    margin: 0 auto 2.8rem;
    font-size: .93rem;
    font-style: italic;
    color: var(--gris);
    line-height: 1.9;
  }
  .intro-opciones .intro-segunda { display: block; margin-top: 1rem; }
  .hotel {
    border: 1px solid var(--linea);
    border-radius: 12px;
    padding: 1.4rem 1.2rem;
    margin-bottom: 1.2rem;
  }
  .hotel .logo {
    display: block;
    width: 100%;
    max-width: 190px;
    height: auto;
    margin: 0 auto .9rem;
  }
  .hotel .nombre {
    font-family: "Playfair Display", Georgia, serif;
    font-size: 1.2rem;
    color: var(--tinta);
  }
  .hotel .rating { margin-top: .3rem; font-size: .92rem; line-height: 1.7; }
  .hotel .rating .etiqueta { letter-spacing: .1em; color: var(--gris); }
  .hotel .rating .estrellas { color: var(--maroon); }
  .hotel .rating .precio { color: var(--navy); }
  .hotel .nota { font-size: .85rem; color: var(--gris); margin-top: .3rem; }
  .hotel .enlaces {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .5rem .7rem;
    margin-top: 1rem;
  }
  .hotel .enlaces a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--navy);
    text-decoration: none;
    border: 1px solid var(--linea);
    border-radius: 50px;
    padding: .55rem .8rem;
    transition: border-color .2s, color .2s;
  }
  .hotel .enlaces a svg { width: 1.5em; height: 1.5em; }
  .hotel .enlaces a:hover { border-color: var(--navy); }
  .hotel .distancias {
    margin-top: 1.1rem;
    padding-top: 1.1rem;
    border-top: 1px dashed var(--linea);
    text-align: center;
  }
  .hotel .distancias .pista {
    font-size: .72rem;
    font-style: italic;
    letter-spacing: .1em;
    color: var(--gris);
    margin-bottom: .8rem;
  }
  .hotel .distancias .pista-borde {
    margin-top: 1.2rem;
    padding-top: 1.2rem;
    border-top: 1px dashed var(--linea);
  }
  .hotel .distancias .rutas {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: .5rem .7rem;
  }
  .hotel .distancias a {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    font-size: .66rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--maroon);
    text-decoration: none;
    border: 1px solid var(--linea);
    border-radius: 50px;
    padding: .4rem .8rem;
    transition: border-color .2s, color .2s;
  }
  .hotel .distancias a svg { width: 1.1em; height: 1.1em; }
  .hotel .distancias a:hover { border-color: var(--maroon); }
  .ruleta { height: 1px; width: 100%; max-width: 240px; margin: 2.4rem auto 0;
            background: linear-gradient(90deg, transparent, var(--linea), transparent); }
</style>
</head>
<body>
<div class="contenido">

  <p class="pareja">Génesis &amp; Emilio</p>

  <h1 class="titulo-seccion">Hospedaje recomendado</h1>
  <p class="intro-opciones">Si necesitas hospedarte en la ciudad, hemos armado esta lista con mucho cariño para ayudarte.<span class="intro-segunda">Está categorizada por tarifas y lujo, para que elijas el que más se ajuste a tus preferencias.</span></p>
  <div class="hoteles" id="hoteles"></div>

  <div class="ruleta"></div>

  <a class="volver" id="volver" href="invitacion.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Volver a la invitación
  </a>

</div>

<script src="config.js?v=20260809-6"></script>
<script>
  (function () {
    const C = CONFIG;
    const nombre = (new URLSearchParams(location.search).get("n") || "").trim();
    document.getElementById("volver").href = "invitacion.html" + (nombre ? "?n=" + encodeURIComponent(nombre) : "");
    document.getElementById("hoteles").innerHTML = C.hoteles.map(function (h) {
      var estrellas = "";
      for (var i = 0; i < (h.lujo || 0); i++) estrellas += "★";
      var rating = "";
      if (estrellas) rating += 'Lujo: <span class="estrellas">' + estrellas + '</span>';
      if (h.precio) rating += (rating ? " &nbsp;•&nbsp; " : "") + 'Precio: <span class="precio">' + h.precio + '</span>';
      var enlaces = "";
      if (h.web) enlaces += '<a href="' + h.web + '" target="_blank" rel="noopener" title="Sitio web"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></a>';
      if (h.instagram) enlaces += '<a href="' + h.instagram + '" target="_blank" rel="noopener" title="Instagram"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>';
      if (h.whatsapp) enlaces += '<a href="' + h.whatsapp + '" target="_blank" rel="noopener" title="Reservar por WhatsApp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></a>';
      if (h.enlace) enlaces += '<a href="' + h.enlace + '" target="_blank" rel="noopener" title="Ubicación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></a>';
      var distancias = "";
      if (h.coordenadas) {
        var iglesia = "https://www.google.com/maps/dir/?api=1&origin=" + h.coordenadas + "&destination=10.070612,-69.302381&travelmode=driving";
        var brindis = "https://www.google.com/maps/dir/?api=1&origin=" + h.coordenadas + "&destination=10.016507,-69.302850&travelmode=driving";
        var regreso = "https://www.google.com/maps/dir/?api=1&destination=" + h.coordenadas + "&travelmode=driving";
        distancias = '<div class="distancias">' +
          '<p class="pista">También es útil saber las distancias:</p>' +
          '<div class="rutas">' +
          '<a href="' + iglesia + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6v16"/><path d="M1 14H8v6"/><path d="M8 6v14"/><path d="M16 6v16"/><path d="M16 10h6"/><path d="M22 6v16"/></svg>Hotel a la Iglesia</a>' +
          '<a href="' + brindis + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13.5V21"/><path d="M16 13.5V21"/><path d="M7 3c0 3-1 4.5-1 6a3 3 0 0 0 6 0c0-1.5-1-3-1-6"/><path d="M15 3c0 3-1 4.5-1 6a3 3 0 0 0 6 0c0-1.5-1-3-1-6"/><path d="M8 21h8"/></svg>Hotel al Brindis</a>' +
          '</div>' +
          '<p class="pista pista-borde">Por si te perdiste y necesitas regresarte:</p>' +
          '<div class="rutas">' +
          '<a href="' + regreso + '" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Tu ubicación - Hotel</a>' +
          '</div>' +
          '</div>';
      }
      return '<div class="hotel">' +
        (h.logo ? '<img class="logo" src="' + h.logo + '" alt="' + h.nombre + '">' + (h.mostrarNombre ? '<p class="nombre">' + h.nombre + '</p>' : "") : '<p class="nombre">' + h.nombre + '</p>') +
        (rating ? '<p class="rating">' + rating + '</p>' : "") +
        (h.nota ? '<p class="nota">' + h.nota + '</p>' : "") +
        (enlaces ? '<div class="enlaces">' + enlaces + '</div>' : "") +
        distancias +
        '</div>';
    }).join("");
  })();
</script>
</body>
</html>

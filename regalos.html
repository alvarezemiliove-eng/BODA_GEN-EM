<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regalos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --blanco: #ffffff;
    --tinta: #1f1f1f;
    --navy: #323c61;
    --maroon: #602229;
    --gris: #6b6b6b;
    --linea: #d8d3c8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Myriad Pro", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: var(--blanco);
    color: var(--tinta);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .contenido {
    max-width: 560px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
    text-align: center;
  }
  .volver {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    margin-top: 2.6rem;
    font-size: .78rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--navy);
    text-decoration: none;
    border-bottom: 1px solid var(--navy);
    padding-bottom: .1rem;
  }
  .volver svg { width: 1em; height: 1em; }
  .pareja {
    margin-top: 2.6rem;
    margin-bottom: 2.4rem;
    font-family: "Playfair Display SC", Georgia, serif;
    font-variant: small-caps;
    font-size: 1.15rem;
    letter-spacing: .14em;
    color: var(--tinta);
  }
  .titulo-seccion {
    margin-top: 3rem;
    font-family: "Playfair Display SC", Georgia, serif;
    font-variant: small-caps;
    font-size: 1.5rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    color: var(--navy);
    margin-bottom: 2.4rem;
  }
  .regalos-mensaje {
    max-width: 400px;
    margin: 0 auto;
    font-size: .95rem;
    font-style: italic;
    color: var(--gris);
  }
  .cuentas { margin-top: 2rem; }
  .cuenta {
    border: 1px solid var(--linea);
    border-radius: 12px;
    padding: 1.4rem 1.2rem;
    margin-bottom: 1.2rem;
  }
  .cuenta .logo {
    display: block;
    width: auto;
    max-width: 160px;
    height: auto;
    margin: .8rem auto 1rem;
  }
  .cuenta .simbolo {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 74px;
    height: 74px;
    margin: .9rem auto 1.2rem;
    border: 1px solid var(--navy);
    border-radius: 50%;
    font-family: "Playfair Display SC", Georgia, serif;
    font-size: 2.2rem;
    line-height: 1;
    color: var(--navy);
  }
  .cuenta .banco {
    font-family: "Playfair Display SC", Georgia, serif;
    font-variant: small-caps;
    font-size: 1.05rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--navy);
  }
  .cuenta .subtitulo { font-size: .88rem; color: var(--gris); margin: .1rem 0 .4rem; }
  .cuenta .dato {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .8rem;
    text-align: left;
    padding: .6rem 0;
    border-bottom: 1px dashed var(--linea);
  }
  .cuenta .dato:last-child { border-bottom: none; }
  .cuenta .campo { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .cuenta .etiqueta {
    font-size: .62rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--gris);
  }
  .cuenta .valor {
    font-size: .95rem;
    color: var(--tinta);
    word-break: break-word;
    margin-top: .1rem;
  }
  .btn-copiar {
    padding: .3rem .9rem;
    border: 1px solid var(--navy);
    border-radius: 50px;
    background: #fff;
    color: var(--navy);
    font-family: inherit;
    font-size: .68rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all .2s ease;
  }
  .btn-copiar:hover { background: var(--navy); color: #fff; }
  .btn-copiar.copiado { background: var(--navy); color: #fff; }
  .ruleta { height: 1px; width: 100%; max-width: 240px; margin: 2.4rem auto 0;
            background: linear-gradient(90deg, transparent, var(--linea), transparent); }
</style>
</head>
<body>
<div class="contenido">

  <p class="pareja">Génesis &amp; Emilio</p>

  <h1 class="titulo-seccion">Regalos</h1>
  <p class="regalos-mensaje" id="regalos-mensaje"></p>

  <div class="cuentas" id="cuentas"></div>

  <div class="ruleta"></div>

  <a class="volver" id="volver" href="invitacion.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Volver a la invitación
  </a>

</div>

<script src="config.js"></script>
<script>
  (function () {
    const C = CONFIG;
    const nombre = (new URLSearchParams(location.search).get("n") || "").trim();
    document.getElementById("volver").href = "invitacion.html" + (nombre ? "?n=" + encodeURIComponent(nombre) : "");

    document.getElementById("regalos-mensaje").textContent = C.regalos.mensaje;
    document.getElementById("cuentas").innerHTML = C.regalos.cuentas.map(function (c) {
      var filas = c.filas.map(function (f) {
        var boton = f.copiar ? '<button class="btn-copiar" type="button" data-copiar="' + f.valor + '">Copiar</button>' : "";
        return '<div class="dato">' +
          '<div class="campo"><span class="etiqueta">' + f.etiqueta + '</span><span class="valor">' + f.valor + '</span></div>' +
          boton +
          '</div>';
      }).join("");
      return '<div class="cuenta">' +
        '<p class="banco">' + c.titulo + '</p>' +
        (c.logo ? '<img class="logo" src="' + c.logo + '" alt="' + c.titulo + '" style="' + (c.logoAncho ? 'max-width:' + c.logoAncho + 'px;' : "") + '">' : (c.simbolo ? '<span class="simbolo">' + c.simbolo + '</span>' : "")) +
        '<div class="datos">' + filas + '</div>' +
        '</div>';
    }).join("");

    document.addEventListener("click", function (e) {
      const btn = e.target.closest(".btn-copiar");
      if (!btn) return;
      navigator.clipboard.writeText(btn.dataset.copiar).then(function () {
        btn.textContent = "Copiado";
        btn.classList.add("copiado");
        setTimeout(function () {
          btn.textContent = "Copiar";
          btn.classList.remove("copiado");
        }, 1500);
      });
    });
  })();
</script>
</body>
</html>
